<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera aplicación</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Desarrollo de Software V</p>
      <h1>Mi primera aplicación</h1>
      <p class="description">Escribe tu nombre para recibir un saludo.</p>

      <form id="greeting-form">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" placeholder="Ejemplo: Ana" autocomplete="name">
        <button type="submit">Mostrar mensaje</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
